<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Audio-to-AI-Dubbing</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; }
      .uploader { border: 2px dashed #ccc; padding: 20px; max-width: 800px; }
      .hidden { display: none; }
      button { padding: 10px 16px; font-size: 16px; }
      .speaker-row { margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Audio-to-AI-Dubbing</h1>
    <div class="uploader">
      <p>Upload an audio or video file (any length supported; large files may take a while). Supported: mp3, wav, m4a, mp4, mov, mkv, webm, ogg</p>
      <input id="file-input" type="file" accept="audio/*,video/*">
      <div id="upload-result" class="hidden">
        <p>Uploaded: <span id="uploaded-filename"></span></p>
        <button id="diarize-btn">Detect speakers</button>
        <div id="speakers" class="hidden">
          <h3>Detected speakers</h3>
          <div id="speaker-list"></div>
          <p>Select a voice for each detected speaker, then click "Generate dubbed voice".</p>
        </div>
        <br>
        <div id="generate-area" class="hidden">
          <button id="generate-btn">Generate dubbed voice</button>
        </div>
      </div>
      <div id="status"></div>
      <div id="download" class="hidden">
        <p>Download: <a id="download-link" href="#">dubbed audio</a></p>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById('file-input');
      const uploadResult = document.getElementById('upload-result');
      const uploadedFilename = document.getElementById('uploaded-filename');
      const status = document.getElementById('status');
      const generateBtn = document.getElementById('generate-btn');
      const diarizeBtn = document.getElementById('diarize-btn');
      const speakersDiv = document.getElementById('speakers');
      const speakerList = document.getElementById('speaker-list');
      const generateArea = document.getElementById('generate-area');
      const downloadDiv = document.getElementById('download');
      const downloadLink = document.getElementById('download-link');

      let uploadedFileId = null;
      let detectedSegments = [];

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        status.innerText = 'Uploading...';
        const form = new FormData();
        form.append('file', file);
        try {
          const resp = await fetch('/upload', { method: 'POST', body: form });
          const j = await resp.json();
          if (resp.ok) {
            uploadedFileId = j.file_id;
            uploadedFilename.innerText = j.filename;
            uploadResult.classList.remove('hidden');
            status.innerText = 'Upload complete.';
          } else {
            status.innerText = 'Upload failed: ' + (j.error || JSON.stringify(j));
          }
        } catch (err) {
          status.innerText = 'Upload error: ' + err;
        }
      });

      diarizeBtn.addEventListener('click', async () => {
        if (!uploadedFileId) {
          alert('Please upload a file first');
          return;
        }
        status.innerText = 'Detecting speakers... (this may take a while)';
        try {
          const resp = await fetch('/diarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_id: uploadedFileId }),
          });
          const j = await resp.json();
          if (resp.ok) {
            detectedSegments = j.segments || [];
            const speakers = j.speakers || [];
            speakerList.innerHTML = '';
            speakers.forEach(s => {
              const row = document.createElement('div');
              row.className = 'speaker-row';
              row.innerHTML = `
                <label>${s.id}</label>
                <select data-speaker="${s.id}" class="voice-select">
                  <option value="alloy">Alloy (example)</option>
                  <option value="femme">Femme (example)</option>
                  <option value="default">Default</option>
                </select>
              `;
              speakerList.appendChild(row);
            });
            speakersDiv.classList.remove('hidden');
            generateArea.classList.remove('hidden');
            status.innerText = 'Speaker detection complete.';
          } else {
            status.innerText = 'Diarization failed: ' + (j.error || JSON.stringify(j));
          }
        } catch (err) {
          status.innerText = 'Diarization error: ' + err;
        }
      });

      generateBtn.addEventListener('click', async () => {
        if (!uploadedFileId) {
          alert('Please upload a file first');
          return;
        }
        // collect voice mapping
        const selects = Array.from(document.getElementsByClassName('voice-select'));
        const voice_map = {};
        selects.forEach(s => {
          const sp = s.getAttribute('data-speaker');
          voice_map[sp] = s.value;
        });

        status.innerText = 'Generating dubbed voice (this may take a while)...';
        downloadDiv.classList.add('hidden');
        try {
          const resp = await fetch('/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_id: uploadedFileId, voice_map }),
          });
          const j = await resp.json();
          if (resp.ok) {
            const url = j.download_url;
            downloadLink.href = url;
            downloadDiv.classList.remove('hidden');
            status.innerText = 'Generation complete.';
          } else {
            status.innerText = 'Generation failed: ' + (j.error || JSON.stringify(j));
          }
        } catch (err) {
          status.innerText = 'Generation error: ' + err;
        }
      });
    </script>
  </body>
</html>
